<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Africore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --accent: #7c5cff;
            --bg: #111111;
            --surface: #1e1e32;
            --surface-2: #16162a;
            --border: #2a2a40;
            --text: #e0e0e0;
            --text-muted: #888;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container { width: 90%; max-width: 400px; animation: fadeIn 0.6s ease forwards; }

        .logo-wrap { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 70px; height: 70px; margin: 0 auto 16px;
            border-radius: 50%; background: linear-gradient(135deg, #1a3a8a, #5b3fd4, #8b5cf6, #c026d3); border: 2px solid rgba(124,92,255,0.3);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.2);
            transition: box-shadow 0.3s;
        }
        .logo-icon:hover {
            box-shadow: 0 0 30px rgba(124, 92, 255, 0.4);
        }
        .logo-icon i { font-size: 1.5rem; color: #fff; margin-left: 2px; }
        .logo-title {
            font-size: 1.8rem; font-weight: 300; margin-bottom: 4px;
            background: linear-gradient(135deg, #5b3fd4, #7c5cff, #b44dff, #c026d3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 0.15em;
        }
        .logo-sub { font-size: 0.82rem; color: var(--text-muted); }

        .login-card {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(124, 92, 255, 0.15);
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 0 30px rgba(124,92,255,0.08);
            transition: all 0.3s ease;
        }
        .login-card:hover {
            border-color: rgba(124, 92, 255, 0.4);
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.2), 0 0 40px rgba(124, 92, 255, 0.1);
        }

        .card-title { font-size: 1rem; font-weight: 600; text-align: center; margin-bottom: 4px; }
        .card-desc { font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.85rem;
        }
        .input-group input {
            width: 100%; padding: 12px 40px 12px 40px;
            background: rgba(13, 13, 24, 0.8);
            border: 1px solid #2a2a40;
            border-radius: 8px;
            color: var(--text); font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-group input:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.2);
        }
        .input-group input::placeholder { color: var(--text-muted); }
        .input-eye {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;
        }
        .input-eye:hover { color: var(--text); }

        .error-msg { color: #ff4444; font-size: 0.78rem; text-align: center; min-height: 18px; margin-bottom: 6px; opacity: 0; transition: opacity 0.3s; }
        .error-msg.show { opacity: 1; }

        .login-btn {
            width: 100%; padding: 12px;
            border: none; border-radius: 4px;
            background: linear-gradient(135deg, #5b3fd4, #7c5cff, #c026d3);
            color: #fff; font-size: 0.9rem; font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 0 15px rgba(124, 92, 255, 0.3);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .login-btn:hover {
            box-shadow: 0 0 25px rgba(124, 92, 255, 0.5);
            transform: translateY(-1px);
        }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-loader {
            width: 16px; height: 16px;
            border: 2px solid transparent; border-top-color: #111;
            border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease forwards; }

        .login-footer { text-align: center; margin-top: 20px; }
        .back-link {
            color: var(--text-muted); font-size: 0.8rem;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .back-link:hover { color: #7c5cff; text-shadow: 0 0 8px rgba(124, 92, 255, 0.3); }

        .features { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .feature-pill {
            padding: 4px 12px; border-radius: 20px;
            background: rgba(124, 92, 255, 0.15);
            border: 1px solid rgba(124, 92, 255, 0.3);
            font-size: 0.7rem; color: #b4a0ff; display: flex; align-items: center; gap: 4px;
        }

        @media (max-width: 480px) { .login-card { padding: 22px 16px; } .logo-title { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;background:#111111;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s,visibility 0.5s;">
        <div style="text-align:center;">
            <img src="logo.png" alt="Africore" style="width:70px;height:70px;margin:0 auto 16px;border-radius:14px;object-fit:cover;display:block;">
            <h1 style="font-size:1.8rem;font-weight:300;color:#e0e0e0;margin-bottom:6px;letter-spacing:0.15em;">AFRICORE</h1>
            <p style="font-size:0.82rem;color:#888;margin-bottom:20px;">Lade Inhalte...</p>
            <div style="width:140px;height:3px;background:#2a2a40;margin:0 auto;border-radius:2px;overflow:hidden;">
                <div style="width:0;height:100%;background:linear-gradient(90deg, #1a3a8a, #5b3fd4, #8b5cf6, #c026d3);border-radius:2px;animation:splashLoad 2s ease forwards;"></div>
            </div>
        </div>
    </div>
    <style>
        @keyframes splashLoad { 0%{width:0} 100%{width:100%} }
    </style>

    <div class="login-container">
        <div class="logo-wrap">
            <img src="logo.png" alt="Africore" style="width:80px;height:80px;border-radius:16px;object-fit:cover;margin:0 auto 16px;display:block;">
            <h1 class="logo-title">Africore</h1>
            <p class="logo-sub">Anime Streaming Hub</p>
        </div>

        <div class="login-card">
            <h2 class="card-title">Willkommen zurück</h2>
            <p class="card-desc">Gib dein Anime-Token ein um fortzufahren</p>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <input type="password" id="anime-token" placeholder="Anime-Token eingeben" autocomplete="off">
                    <i class="fa-solid fa-key"></i>
                    <button type="button" class="input-eye" id="toggle-eye" title="Passwort anzeigen">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
                <div class="error-msg" id="error-msg"></div>
                <button type="submit" class="login-btn" id="login-btn">
                    <span id="btn-text">Einloggen</span>
                    <div class="btn-loader" id="btn-loader"></div>
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p style="color:var(--text-muted);font-size:0.78rem;">Nur für autorisierte Nutzer</p>
        </div>

        <div class="features">
            <span class="feature-pill"><i class="fa-solid fa-fire"></i> Trending</span>
            <span class="feature-pill"><i class="fa-solid fa-download"></i> Download</span>
            <span class="feature-pill"><i class="fa-solid fa-tv"></i> 4K Ultra HD</span>
            <span class="feature-pill"><i class="fa-solid fa-closed-captioning"></i> Multi-Sprache</span>
        </div>
    </div>

    <script>
        // Splash Screen
        (function() {
            const splash = document.getElementById('splash');
            if (!splash) return;
            setTimeout(() => {
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                setTimeout(() => splash.remove(), 800);
            }, 3000);
        })();

        // Particles
        (function() {
        })();

        // Toggle password visibility
        const toggleBtn = document.getElementById('toggle-eye');
        const eyeIcon = document.getElementById('eye-icon');
        const tokenInput = document.getElementById('anime-token');
        toggleBtn.addEventListener('click', () => {
            const isPass = tokenInput.type === 'password';
            tokenInput.type = isPass ? 'text' : 'password';
            eyeIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Login
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = tokenInput.value.trim();
            if (!token) {
                errorMsg.textContent = 'Token eingeben';
                errorMsg.classList.add('show');
                tokenInput.focus();
                return;
            }

            errorMsg.classList.remove('show');
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: token, bot: 'anime' })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('anime_token', token);
                    localStorage.setItem('anime_user', data.username || 'User');
                    window.location.href = '/anime.html';
                } else {
                    errorMsg.textContent = data.error || 'Ungültiges Token';
                    errorMsg.classList.add('show');
                    tokenInput.value = '';
                    tokenInput.focus();
                }
            } catch (err) {
                errorMsg.textContent = 'Verbindung fehlgeschlagen';
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = '';
                btnLoader.style.display = 'none';
            }
        });

        // Enter key
        tokenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') form.requestSubmit();
        });
        tokenInput.focus();
    </script>
</body>
</html>
